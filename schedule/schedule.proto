syntax = "proto3";

service Schedule {
    rpc get_full_schedule (Empty) returns (stream Screening) {}
    rpc get_schedule_bydate (Date) returns (Screening) {}
    rpc get_schedule_from_to (stream Date) returns (stream Screening) {}
    rpc add_screenings (Screenings) returns (Screenings) {}
    rpc cancel_screenings (Screenings) returns (Screenings) {}
}

message Screenings {
    repeated Screening screenings = 1;
}

message Screening {
    string date = 1;
    repeated string movies = 2;
}

message Date {
    string date = 1;
}

message Empty{}

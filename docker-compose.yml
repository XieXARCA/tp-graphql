services:
  movie:
    build: 
      context: .
      dockerfile: movie/Dockerfile
    ports:
      - "3200:3200"
  
  booking:
    build: 
      context: .
      dockerfile: booking/Dockerfile
    ports:
      - "3201:3201"

  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    ports:
      - "3202:3202"

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    ports:
      - "3203:3203"

  mongo:
    image: mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    ports: 
    - 27017:27017
  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: false

volumes:
  mongo_data:
